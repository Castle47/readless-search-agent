source_first_workflow_version: 1
context_workflow_version: 1
astra_profile:
  timeout_seconds: 300
  min_output: 8000
  role_outputs: {writer: 24000, report_verifier: 24000, editor: 24000}
  research: {wall_seconds: 1800, finalization_seconds: 900}
adaptive_research_workflow_version: 1
adaptive_profile:
  shared_finalization_budget: true
  worker:
    lease_seconds: 90
  research:
    survey_queries: 3
    survey_pages: 5
    overview_min_sources: 3
    breadth_extra_searches: 2
    rounds_per_task: 4
    post_write_searches: 2
    post_write_pages: 2
    search_results: 10
    total_tokens: 400000
    token_partitions: {research: 180000, finalization: 212000, memory: 8000}
    wall_seconds: 1200
    finalization_seconds: 420
  model:
    timeout_seconds: 120
    roles:
      understand: {max_input: 12000, max_output: 1200}
      planner: {max_input: 16000, max_output: 2400}
      source_selector: {max_input: 10000, max_output: 3000}
      reason: {max_input: 8000, max_output: 1200}
      source_reader: {max_input: 16000, max_output: 2400}
      readiness: {max_input: 24000, max_output: 3000}
      writer: {max_input: 48000, max_output: 8000}
      report_verifier: {max_input: 64000, max_output: 12000, total_cap: 70000, max_paragraphs: 4}
      editor: {max_input: 64000, max_output: 8000}
      quality: {max_input: 12000, max_output: 2000, total_cap: 14000}
    finalization_split: {writer: 56000, report_verifier: 70000, repair_and_recheck: 72000, quality: 14000}
app:
  owner_id: local
  max_concurrent_runs: 1
research:
  initial_tasks: 3
  max_initial_tasks: 5
  parallel_researchers: 3
  rounds_per_task: 3
  max_supplemental_batches: 1
  supplemental_tasks: 2
  supplemental_rounds_per_task: 2
  no_progress_rounds: 2
  search_calls: 16
  fetched_pages: 30
  search_http_attempts: 48
  fetch_http_attempts: 90
  llm_http_attempts: 200
  search_results: 5
  pages_per_round: 2
  total_tokens: 300000
  token_partitions:
    research: 196000
    finalization: 96000
    memory: 8000
  wall_seconds: 600
  finalization_seconds: 180
  min_supplemental_seconds: 60
  min_supplemental_tokens: 20000
model:
  temperature: 0
  timeout_seconds: 45
  roles:                      # 输入/输出 token 上限，输入含提示词
    query_rewrite:     {max_input: 16000, max_output: 1800}
    conversation_summary: {max_input: 16000, max_output: 2000}
    understand:        {max_input: 6000,  max_output: 800}
    planner:           {max_input: 8000,  max_output: 1500}
    source_selector:   {max_input: 2500,  max_output: 400}
    reason:            {max_input: 2500,  max_output: 400}
    extract:           {max_input: 6000,  max_output: 1600}
    source_reader:     {max_input: 6000,  max_output: 1600}
    evidence_verifier: {max_input: 6000,  max_output: 1200}
    merge:             {max_input: 3000,  max_output: 1200}
    gap:               {max_input: 3000,  max_output: 800}
    writer:            {max_input: 12000, max_output: 4000}
    report_verifier:   {max_input: 12000, max_output: 2400, total_cap: 40000, max_paragraphs: 4}
    quality:           {max_input: 5000,  max_output: 1000, total_cap: 6000}
    repair:            {max_input: 4000,  max_output: 1500}
    editor:            {max_input: 20000, max_output: 4000}
    memory_candidates: {max_input: 2000,  max_output: 1000}
  finalization_split:
    writer: 16000
    report_verifier: 40000
    repair_and_recheck: 34000
    quality: 6000
search:
  timeout_seconds: 15
fetch:
  timeout_seconds: 20
  max_redirects: 3
  max_response_bytes: 2097152
  max_text_chars: 100000
  chunk_chars: 2500
  chunk_overlap_chars: 200
  chunks_per_page: 4
memory:
  scope: research-general
  recall_top_k: 5
  recall_token_limit: 2000
  timeout_seconds: 10
  max_new_items: 5
  block_char_limits:
    research_policy: 2000
    research_lessons: 4000
    source_patterns: 4000
    open_questions: 4000
  outbox_retry_delays_seconds: [10, 60, 300, 1800, 3600]
  outbox_max_attempts: 6
  reconcile_interval_seconds: 60
  reconcile_max_checks: 10
worker:
  lease_seconds: 30
  heartbeat_seconds: 10
  graph_recursion_limit: 1000
  cancel_poll_seconds: 1
retry:
  max_attempts: 3
  backoff_seconds: [1, 2]
  jitter_ms: 250
  retry_after_cap_seconds: 30
  structured_repair_attempts: 1
