[project]
name = "readless-research-agent"
version = "0.1.0"
description = "Bounded, recoverable web research for ReadLess"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "trafilatura>=2,<3",
  "lxml>=6,<7",
  "tiktoken>=0.9,<1",
  "tldextract>=5,<6",
  "letta-client>=1,<2",
  "pyyaml>=6,<7",
  "prometheus-client>=0.21,<1",
  "pypdf>=5,<7",
  "pymupdf>=1.26,<2",
  "jieba==0.42.1",
  "spacy>=3.8,<3.9",
]
[project.scripts]
research-agent = "research_agent.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires explicit external-service opt-in", "integration: real PostgreSQL"]
[tool.ruff]
line-length = 110
